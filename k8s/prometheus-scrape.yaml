# k8s/prometheus-scrape.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: prom-config
  namespace: team
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: serving
        metrics_path: /metrics
        static_configs:
          - targets: ["team-serving:8000", "llama-serving:8000"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prom-data
  namespace: team
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: team
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml",
                 "--storage.tsdb.retention.time=30d"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prom-config}
        - name: data
          persistentVolumeClaim: {claimName: prom-data}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: team
spec:
  selector: {app: prometheus}
  ports:
    - port: 9090
      targetPort: 9090