apiVersion: v1
kind: Service
metadata:
  name: llama-serving
spec:
  selector: {app: llama}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama
spec:
  replicas: 1
  selector: {matchLabels: {app: llama}}
  template:
    metadata: {labels: {app: llama}}
    spec:
      containers:
        - name: llama
          image: vllm/vllm-openai:v0.27.1
          args:
            - --model=NousResearch/Meta-Llama-3.1-8B-Instruct
            - --dtype=half
            - --max-model-len=32768
            - --gpu-memory-utilization=0.85
            - --enable-auto-tool-choice
            - --tool-call-parser=llama3_json
          ports:
            - containerPort: 8000
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef: {name: serving-keys, key: api-key}
          resources:
            requests: {cpu: "4", memory: 16Gi, nvidia.com/gpu: 1}
            limits: {cpu: "4", memory: 16Gi, nvidia.com/gpu: 1}
          volumeMounts:
            - {name: hf-cache, mountPath: /root/.cache/huggingface}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
      volumes:
        - name: hf-cache
          hostPath: {path: /var/lib/hf-cache, type: DirectoryOrCreate}
