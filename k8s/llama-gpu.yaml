apiVersion: v1
kind: Service
metadata:
  name: llama-serving
  namespace: team
spec:
  selector: {app: llama}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama
  namespace: team
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: {matchLabels: {app: llama}}
  template:
    metadata: {labels: {app: llama}}
    spec:
      containers:
        - name: llama
          image: vllm/vllm-openai:v0.27.1
          args:
            - --model=hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4
            - --served-model-name=NousResearch/Meta-Llama-3.1-8B-Instruct
            - --quantization=awq
            - --dtype=half
            - --gpu-memory-utilization=0.90
            - --max-model-len=32768
            - --max-num-batched-tokens=32768
            - --max-num-seqs=32
            - --host=0.0.0.0
            - --port=8000
            - --api-key=$(VLLM_API_KEY)
            - --enable-auto-tool-choice
            - --tool-call-parser=llama3_json
          ports:
            - containerPort: 8000
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef: {name: serving-keys, key: api-key}
          resources:
            requests: {cpu: "4", memory: 24Gi, nvidia.com/gpu: 1}
            limits: {cpu: "4", memory: 24Gi, nvidia.com/gpu: 1}
          volumeMounts:
            - {name: hf-cache, mountPath: /root/.cache/huggingface}
            - {name: dshm, mountPath: /dev/shm}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: hf-cache
          hostPath: {path: /var/lib/hf-cache, type: DirectoryOrCreate}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 4Gi}
