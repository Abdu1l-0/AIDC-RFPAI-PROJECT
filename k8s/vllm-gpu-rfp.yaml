apiVersion: v1
kind: Service
metadata:
  name: team-serving # Service name is team-serving to avoid VLLM_PORT env collision
  namespace: team
spec:
  type: NodePort
  selector:
    app: rfp-vllm
  ports:
    - name: http-openai
      port: 8000
      targetPort: 8000
      nodePort: 30800
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rfp-vllm
  namespace: team
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rfp-vllm
  template:
    metadata:
      labels:
        app: rfp-vllm
    spec:
      containers:
        - name: vllm-engine
          image: vllm/vllm-openai:v0.6.3
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: serving-keys
                  key: api-key
          args:
            - --model=Qwen/Qwen2.5-7B-Instruct-AWQ
            - --served-model-name=rfp-extractor
            - --quantization=awq
            - --dtype=half
            - --gpu-memory-utilization=0.90
            - --max-model-len=32768
            - --max-num-batched-tokens=32768
            - --max-num-seqs=32
            - --max-seq-len-to-capture=32768
            - --host=0.0.0.0
            - --port=8000
            - --api-key=$(VLLM_API_KEY)
          resources:
            requests:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: hf-cache
          hostPath:
            path: /var/lib/hf-cache
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi